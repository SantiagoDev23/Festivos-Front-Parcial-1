<mat-toolbar>
  <img src="iconos/Festivo.png">
  <div class="barraTituloCRUD">
    Consultar Festivos
  </div>
</mat-toolbar>

<div>
  <mat-form-field appearance="fill">
    <mat-label>País</mat-label>
    <mat-select [(value)]="idPais">
      <mat-option *ngFor="let p of paises" [value]="p.id">
        {{p.nombre}}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>

<div>
  <mat-form-field appearance="fill">
    <mat-label>Día</mat-label>
    <input matInput type="number" min="1" max="31" [(ngModel)]="dia">
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Mes</mat-label>
    <input matInput type="number" min="1" max="12" [(ngModel)]="mes">
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Año</mat-label>
    <input matInput type="number" [(ngModel)]="anio">
  </mat-form-field>
  <button matButton="filled" (click)="verificar()">Verificar fecha</button>
  <button matButton="tonal" (click)="listarFestivos()">Festivos del año</button>
</div>

<div *ngIf="resultado">
  <h3>{{resultado}}</h3>
</div>

<div>
  <ngx-datatable [headerHeight]="50" [footerHeight]="50"
                 [rows]="festivos" [columns]="columnas" class="dark" [limit]="10"
                 [columnMode]="modoColumna.force">
  </ngx-datatable>
</div>
